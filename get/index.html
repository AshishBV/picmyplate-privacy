<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get PicMyPlate</title>
<meta name="description" content="Snap a plate. Know the calories. PicMyPlate is a calorie and nutrition tracker for Android that understands Indian food.">
<!-- What a chat app shows under a shared link. The address people see is
     picmyplate.app/get; this is the card beneath it. -->
<meta property="og:title" content="PicMyPlate - Snap a plate. Know the calories.">
<meta property="og:description" content="A calorie and nutrition tracker for Android that understands Indian food.">
<meta property="og:url" content="https://picmyplate.app/get/">
<meta property="og:site_name" content="PicMyPlate">
<meta property="og:type" content="website">
<!-- THE ONE PLACE THE PACKAGE NAME LIVES OUTSIDE THE APP. Every share in the
     app links here instead of to the Play URL, so a friend sees picmyplate.app
     rather than com.ashishbv.fitai. tests/shareLink holds this link to the
     package in app.json. -->
<meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.ashishbv.fitai">
<link rel="canonical" href="https://picmyplate.app/get/">
<link rel="stylesheet" href="../style.css">
<script>
  window.location.replace('https://play.google.com/store/apps/details?id=com.ashishbv.fitai');
</script>
</head>
<body>
<header>
  <p class="brand">PicMyPlate</p>
  <h1>Get PicMyPlate</h1>
  <p class="updated">Snap a plate. Know the calories.</p>
</header>

<main>
  <p>Taking you to PicMyPlate on Google Play.</p>
  <p><a href="https://play.google.com/store/apps/details?id=com.ashishbv.fitai"><strong>Open PicMyPlate on Google Play</strong></a></p>
</main>

<footer>
  <a href="../privacy.html">Privacy</a>
  <a href="../terms.html">Terms</a>
  <a href="../delete-account.html">Delete account</a>
</footer>
</body>
</html>
